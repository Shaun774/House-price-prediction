<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPrice | House Estimator</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --bg-glass: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Modern Real Estate Background */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&q=80&w=1920');
            background-size: cover;
            background-position: center;
        }

        .card {
            background: var(--bg-glass);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header i {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .header h2 {
            margin: 0;
            color: var(--text-dark);
            font-size: 1.5rem;
        }

        .header p {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .input-group i {
            position: absolute;
            left: 12px;
            top: 38px;
            color: var(--text-light);
        }

        input {
            width: 100%;
            padding: 12px 12px 12px 35px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .result-box {
            margin-top: 2rem;
            padding: 1rem;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .result-label {
            display: block;
            color: #166534;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #15803d;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <i class="fa-solid fa-house-chimney-window"></i>
        <h2>SmartPrice AI</h2>
        <p>Instant Real Estate Valuation</p>
    </div>

    <form method="POST">
        <div class="input-group">
            <label>Living Area</label>
            <i class="fa-solid fa-ruler-combined"></i>
            <input type="number" name="area" placeholder="Sq Ft (e.g. 1500)" required>
        </div>

        <div class="input-group">
            <label>Bedrooms</label>
            <i class="fa-solid fa-bed"></i>
            <input type="number" name="rooms" placeholder="Total Rooms (e.g. 3)" required>
        </div>

        <button type="submit">
            Analyze Market <i class="fa-solid fa-arrow-right"></i>
        </button>
    </form>

    {% if prediction %}
    <div class="result-box">
        <span class="result-label">Estimated Value</span>
        <div class="result-value">₹{{ prediction }} lakhs</div>
    </div>
    {% endif %}
</div>

</body>
</html>
